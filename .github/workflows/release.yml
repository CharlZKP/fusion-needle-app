name: Release

# Push a tag such as v0.1.0: the app is built on Linux, macOS and Windows with
# PyInstaller and the three archives are attached to the GitHub release of that
# tag. The model is not part of the build; the app downloads it on first start.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: linux-x86_64}
          - {os: macos-latest, name: macos-arm64}
          - {os: windows-latest, name: windows-x86_64}
    env:
      ARCHIVE: FusionNeedle-${{ github.ref_name }}-${{ matrix.name }}
      NEEDLE_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: runner.os != 'Windows'

      - name: The tag must match the app version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import app; print(app.__version__)")
          case "$TAG" in
            "v$version"*) echo "tag $TAG, app version $version" ;;
            *) echo "::error::tag $TAG does not match app/__init__.py ($version)"; exit 1 ;;
          esac

      # The build scripts expect the project's environment in .venv and never install into it.
      - name: Environment (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          .venv/bin/needle fetch
      - name: Environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .venv\Scripts\needle fetch
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # --with-engine copies the inference engine library fetched above into the
      # build, so the packaged app needs neither Python nor a second download for it.
      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        run: sh packaging/build.sh --with-engine
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build_windows.ps1 -WithEngine

      - name: Smoke test (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          ls dist/FusionNeedle/_internal/needle
          dist/FusionNeedle/FusionNeedle --version
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist\FusionNeedle\_internal\needle
          & dist\FusionNeedle\FusionNeedle.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Archive (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir out
          cp LICENSE NOTICE.md README.md dist/FusionNeedle/
          tar -C dist -czf "out/$ARCHIVE.tar.gz" FusionNeedle
          cd out && shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item LICENSE, NOTICE.md, README.md, "Start Fusion Needle.bat" dist
          Move-Item dist\LICENSE, dist\NOTICE.md, dist\README.md dist\FusionNeedle
          Compress-Archive -Path dist\FusionNeedle, "dist\Start Fusion Needle.bat" -DestinationPath "out\$env:ARCHIVE.zip"
          $hash = (Get-FileHash "out\$env:ARCHIVE.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ARCHIVE.zip" | Out-File -Encoding ascii "out\$env:ARCHIVE.zip.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: attach to the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: true
