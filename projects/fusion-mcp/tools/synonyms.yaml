# Words of a request that name or clearly imply an enum value:
# tool -> parameter -> enum value -> words or phrases (case-insensitive, whole words,
# flexible inner whitespace). The router uses them as hints for choosing the tools of a step.

create_sketch:
  plane:
    xy: ["xy", "x-y", "top plane"]
    xz: ["xz", "x-z", "front plane"]
    yz: ["yz", "y-z", "right plane"]
  face:
    top: ["top face", "top surface", "top side", "top of the", "on top", "upper face"]
    bottom: ["bottom face", "bottom surface", "bottom side", "bottom of the", "underside", "lower face"]
    front: ["front face", "front surface", "front side", "front of the"]
    back: ["back face", "back surface", "back side", "back of the", "rear face"]
    left: ["left face", "left surface", "left side", "left of the", "left-hand face"]
    right: ["right face", "right surface", "right side", "right of the", "right-hand face"]

add_dimension:
  kind:
    distance: ["distance", "length", "long", "apart", "spacing"]
    horizontal: ["horizontal", "horizontally"]
    vertical: ["vertical", "vertically"]
    diameter: ["diameter", "dia", "ø", "⌀"]
    radius: ["radius", "rad", "radial"]
    angle: ["angle", "angular", "degrees", "degree", "deg", "°"]

add_constraint:
  kind:
    horizontal: ["horizontal", "horizontally"]
    vertical: ["vertical", "vertically"]
    parallel: ["parallel"]
    perpendicular: ["perpendicular", "square to", "at right angles"]
    tangent: ["tangent", "tangential", "tangency"]
    equal: ["equal", "equal length", "same length", "same size"]
    coincident: ["coincident", "coincide", "coincides"]
    concentric: ["concentric", "same centre", "same center"]
    midpoint: ["midpoint", "mid-point", "middle of"]
    symmetric: ["symmetric", "symmetrical", "symmetry"]
    fix: ["fix", "fixed", "lock", "locked", "anchor"]

extrude:
  operation:
    new_body: ["new body", "separate body", "new solid"]
    join: ["join", "joined", "joining", "boss", "add material", "bump"]
    cut: ["cut", "cuts", "cutting", "pocket", "pocketed", "recess", "recessed", "cutout", "cut-out", "remove material"]
    intersect: ["intersect", "intersecting", "intersection"]
  direction:
    positive: ["positive"]
    # v3: "downward", "extrude down" and "extrude bottom" are the flipped side
    # (the sketch normal points up for a sketch on the XY plane, on an offset
    # plane or on a top face). They were unlisted before, and the model guessed
    # symmetric. Bare "down" and "bottom" stay unlisted: "cut down 6 mm",
    # "knock down the edges" and "pocket on the bottom face" name no direction.
    negative: ["negative", "reverse", "reversed", "flipped", "opposite direction", "downward", "downwards", "extrude down", "extrude it down", "extruded down", "pull down", "pull it down", "push down", "push it down", "extrude bottom", "bottom direction", "toward the bottom", "towards the bottom"]
    symmetric: ["symmetric", "symmetrical", "symmetrically", "both sides", "both directions", "both ways", "mid-plane", "midplane", "mid plane"]
  extent:
    distance: ["blind"]
    through_all: ["through all", "through", "thru all", "thru", "all the way through"]

create_hole:
  face:
    top: ["top", "upper"]
    bottom: ["bottom", "underside", "lower", "underneath"]
    front: ["front"]
    back: ["back", "rear"]
    left: ["left", "left-hand"]
    right: ["right face", "right side", "right surface", "from the right", "right-hand"]

circular_pattern:
  axis:
    x: ["x axis", "x-axis", "axis x", "around x", "about x", "around the x", "about the x"]
    y: ["y axis", "y-axis", "axis y", "around y", "about y", "around the y", "about the y"]
    z: ["z axis", "z-axis", "axis z", "around z", "about z", "around the z", "about the z"]
  target:
