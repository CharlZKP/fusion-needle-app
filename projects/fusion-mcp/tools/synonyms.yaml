    xz: ["xz", "x-z", "front plane"]
    yz: ["yz", "y-z", "right plane"]
  target:
    last_feature: ["last feature", "previous feature", "that feature", "the feature"]
    body: ["body", "bodies", "solid", "whole part", "entire part", "whole thing"]

fillet:
