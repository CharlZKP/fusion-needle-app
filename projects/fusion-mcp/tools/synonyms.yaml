    all: ["all", "every", "everywhere"]
    top: ["top", "upper"]
    bottom: ["bottom", "lower", "underside"]
    vertical: ["vertical", "upright", "corners", "corner edges"]

chamfer:
  edges:
    all: ["all", "every", "everywhere"]
